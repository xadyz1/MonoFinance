<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Entrar en SwiftFinance — xestione as súas finanzas persoais de forma sinxela e segura.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Entrar — SwiftFinance</title>
  <style>
    :root {
      --bg: #0A0A0C;
      --surface: #111113;
      --line: #202024;
      --text: #fff;
      --muted: #8E8E93;
      --accent: #20a034;
      --purple: #20a034
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px
    }

    .card {
      width: min(430px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 30px 26px
    }

    .brand {
      display: flex;
      justify-content: center;
      margin: 0 0 20px
    }

    .brand img {
      height: 64px;
      width: auto
    }

    h1 {
      margin: 0;
      font-size: 22px;
      text-align: center
    }

    p.sub {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      margin: 6px 0 22px
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 0 0 6px
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none
    }

    input:focus {
      border-color: var(--accent)
    }

    .field {
      margin: 0 0 14px
    }

    .error {
      display: none;
      color: #F87171;
      font-size: 13px;
      margin: 0 0 12px;
      text-align: center
    }

    button[type=submit] {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: .2s
    }

    button[type=submit]:hover {
      opacity: .9
    }

    .back {
      margin: 18px 0 0;
      text-align: center
    }

    .back a {
      color: var(--muted);
      font-size: 12.5px;
      text-decoration: none
    }
  </style>

  <!-- OneSignal Web Push -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "efc839fd-7a7f-4f79-af11-47177322e61b",
        safari_web_id: "web.onesignal.auto.02091d44-51df-4a38-967b-45e7d1e7feaf",
        allowLocalhostAsSecureOrigin: window.location.hostname === 'localhost',
        serviceWorkerParam: { scope: '/' },
        serviceWorkerPath: 'OneSignalSDKWorker.js',
        notifyButton: {
          enable: true,
        },
      });
      // Hide the OneSignal notify button after the user subscribes
      try {
        const state = await OneSignal.User.PushSubscription.getStateAsync && OneSignal.User.PushSubscription.getStateAsync();
        if (state && state.isSubscribed) {
          OneSignal.Notifications.setSetting('allowNotifyButton', false);
        }
        OneSignal.Notifications.addEventListener('subscriptionChange', (event) => {
          if (event && event.current) {
            OneSignal.Notifications.setSetting('allowNotifyButton', false);
          }
        });
      } catch (e) { console.warn('OneSignal notify button config failed', e); }
    });
  </script>

</head>

<body>
  <div class="card">
    <div class="brand"><img src="swiftlight.png" alt="SwiftFinance"></div>
    <h1 id="title">Entrar</h1>
    <p class="sub" id="subtitle">Aceda ao seu painel SwiftFinance</p>

    <form id="auth-form" novalidate>
      <div class="field">
        <label for="username">Nome de utilizador</label>
        <input id="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="error" id="error"></div>
      <button type="submit" id="submit">Entrar</button>
    </form>

    <div class="back"><a href="/">← Voltar à página principal</a></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    $('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = $('username').value.trim();
      const password = $('password').value;
      if (!username || !password) return;
      const btn = $('submit');
      btn.disabled = true;
      const errBox = $('error');
      errBox.style.display = 'none';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          const checkoutPrice = new URLSearchParams(window.location.search).get('checkout');
          window.location.href = checkoutPrice ? '/?checkout=' + encodeURIComponent(checkoutPrice) + '#pricing' : '/app';
          return;
        }
        errBox.textContent = 'Nome de utilizador ou password incorretos.';
        errBox.style.display = 'block';
      } catch (err) {
        errBox.textContent = 'Não foi possível ligar ao servidor. Tente novamente.';
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
